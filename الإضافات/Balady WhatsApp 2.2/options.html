<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>إعدادات السيرفر - وحدة بلدي</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    direction: rtl;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.hint { font-size: 13px; color: #94a3b8; line-height: 1.8; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid #475569;
    background-color: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    direction: ltr;
    text-align: left;
  }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button {
    padding: 10px 18px;
    border-radius: 9px;
    border: none;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  #save { background-color: #2563eb; color: #fff; }
  #test { background-color: #334155; color: #e2e8f0; }
  #reset { background-color: transparent; color: #94a3b8; border: 1px solid #475569; }
  #status { margin-top: 16px; font-size: 13px; min-height: 20px; line-height: 1.7; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .examples { margin-top: 18px; font-size: 12px; color: #64748b; line-height: 2; }
  code { background-color: #0f172a; padding: 2px 6px; border-radius: 5px; direction: ltr; display: inline-block; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚙️ إعدادات السيرفر</h1>
    <p class="hint">
      حدد السيرفر الذي تتصل به الإضافة. اتركه فارغاً للعودة إلى السيرفر السحابي الافتراضي،
      أو ضع عنوان السيرفر الخارجي (الشبكة الداخلية / VPN) لربط الإضافة به.
    </p>

    <label for="server">عنوان السيرفر</label>
    <input id="server" type="text" placeholder="https://tickets-daem.vercel.app" spellcheck="false" autocomplete="off">

    <div class="row">
      <button id="save" type="button">💾 حفظ</button>
      <button id="test" type="button">🔌 اختبار الاتصال</button>
      <button id="reset" type="button">↩️ العودة للافتراضي</button>
    </div>

    <div id="status"></div>

    <div class="examples">
      أمثلة:
      <code>http://192.168.1.100:3000</code>
      <code>http://balady.local:3000</code>
      <code>https://tickets-daem.vercel.app</code>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
