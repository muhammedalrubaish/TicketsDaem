<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>Balady WhatsApp</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 370px;
  height: 600px;
  overflow: hidden;
  background-color: #0f172a;
}
iframe {
  border: none;
  width: 100%;
  height: calc(100% - 26px);
  display: block;
}
#settings-bar {
  height: 26px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 8px;
  background-color: #1e293b;
  font-family: system-ui, -apple-system, sans-serif;
}
#open-settings {
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}
#open-settings:hover { color: #e2e8f0; }
</style>
</head>
<body>
<div id="update-banner" style="display:none; background-color: #e11d48; color: white; text-align: center; padding: 10px; font-weight: bold; font-size: 13px; border-bottom: 2px solid #be123c; font-family: system-ui, -apple-system, sans-serif; direction: rtl; box-sizing: border-box;">
  ⚠️ يتوفر تحديث جديد للإضافة! 
  <a id="update-link" href="https://drive.google.com/drive/folders/1Qu7fYSYR7My--cK7B7VuA9wM6OfgjFy8" target="_blank" style="color: #ffe4e6; text-decoration: underline; margin-right: 5px; font-weight: 800;">تحميل التحديث الآن</a>
</div>
<div id="settings-bar">
  <button id="open-settings" type="button">⚙ إعدادات السيرفر</button>
</div>
<iframe id="daem-iframe" src="about:blank"></iframe>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
