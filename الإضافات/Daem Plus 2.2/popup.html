<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>Daem Plus</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 370px;
  height: 680px;
  overflow-y: auto;
  background-color: #0f172a;
}
iframe {
  border: none;
  width: 100%;
  height: calc(100% - 26px);
  display: block;
}
#settings-bar {
  height: 26px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 8px;
  background-color: #1e293b;
  font-family: system-ui, -apple-system, sans-serif;
}
#open-settings {
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}
#open-settings:hover { color: #e2e8f0; }
</style>
</head>
<body>
<div id="settings-bar">
  <button id="open-settings" type="button">⚙ إعدادات السيرفر</button>
</div>
<iframe id="daem-iframe" src="about:blank"></iframe>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
